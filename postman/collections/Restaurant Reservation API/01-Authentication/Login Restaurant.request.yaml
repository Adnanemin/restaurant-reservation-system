$kind: http-request
name: Login Restaurant
description: Authenticates a restaurant owner using email and password. On success, returns a JWT token used to access restaurant management endpoints.
url: "{{baseUrl}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "restaurant@test.com",
        "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      const response = pm.response.json();
      pm.environment.set("restaurantToken", response.token);
    language: text/javascript
order: 3259718028060776
